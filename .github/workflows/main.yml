name: Validate Repository Docs Structure

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify /docs Directory and Required Artifacts
        run: |
          echo "Checking repository structure..."
          if [ ! -d "docs" ]; then
            echo "Error: /docs directory missing!"
            exit 1
          fi
          
          echo "Checking required deliverables inside /docs..."
          ls -la docs/
          
          # Ensure ERD image exists
          if ! ls docs/*.png docs/*.jpg docs/*.pdf 1> /dev/null 2>&1; then
            echo "Error: ERD Diagram file missing in /docs!"
            exit 1
          fi

          # Ensure Endpoint plan exists
          if [ ! -f "docs/api_endpoint_plan.md" ] && ! ls docs/*.pdf 1> /dev/null 2>&1; then
            echo "Error: API Endpoint plan document missing in /docs!"
            exit 1
          fi

          # Ensure SQL script exists
          if [ ! -f "docs/schema_and_data.sql" ]; then
            echo "Error: schema_and_data.sql missing in /docs!"
            exit 1
          fi

          echo "Validation successful! All documentation assets present."
