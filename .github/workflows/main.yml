name: Validate Repository Docs Structure

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify /docs Directory and Contents
        run: |
          echo "Checking repository structure..."
          if [ ! -d "docs" ]; then
            echo "::error:: The /docs directory is missing in the repository root!"
            exit 1
          fi
          
          echo "Contents of /docs directory:"
          ls -la docs/

          # Ensure /docs is not empty
          if [ -z "$(ls -A docs/)" ]; then
            echo "::error:: The /docs directory is empty!"
            exit 1
          fi

          # Check for at least one SQL file
          if ! ls docs/*.sql 1> /dev/null 2>&1; then
            echo "::error:: No .sql file found in /docs!"
            exit 1
          fi

          # Check for at least one Markdown or PDF file
          if ! ls docs/*.md 1> /dev/null 2>&1 && ! ls docs/*.pdf 1> /dev/null 2>&1; then
            echo "::error:: No API plan (.md or .pdf) found in /docs!"
            exit 1
          fi

          echo "Validation successful! Documentation files are present."
